<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{color-scheme:light dark}
body{margin:0;font-family:sans-serif;background:linear-gradient(#4285f4,#0d47a1);color:#fff;min-height:100vh}
main{padding:24px}button{font-size:18px;padding:12px 20px;border:0;border-radius:8px}
input{display:block;font-size:18px;padding:10px;margin:8px 0;width:80%}
@media (prefers-color-scheme: dark){body{background:linear-gradient(#202124,#000);color:#e8eaed}}
</style></head>
<body><flutter-view><main>
<h1 id="title">Demo App</h1><p id="route"></p>
<section id="home">
<button id="go" onclick="document.getElementById('title').textContent='Clicked'">Get started</button>
</section>
<section id="login" hidden>
<input id="user" placeholder="Username" autocomplete="off">
<input id="pass" type="password" placeholder="Password">
<button id="signin">Sign in</button>
<p id="error"></p>
</section>
<section id="account" hidden><p id="welcome"></p></section>
</main></flutter-view>
<script>
// Fake auth for testing: demo/demo signs in and is remembered in localStorage.
function render(){
  var h=location.hash||'#/';
  document.getElementById('route').textContent='Route: '+h;
  var user=localStorage.getItem('demoUser');
  var view=h==='#/login'?'login':h==='#/account'?'account':'home';
  ['home','login','account'].forEach(function(id){document.getElementById(id).hidden=id!==view});
  if(view==='account'){
    document.getElementById('title').textContent=user?'Account':'Please sign in';
    document.getElementById('welcome').textContent=user?'Welcome, '+user+' (protected view)':'You are signed out';
  }
}
document.getElementById('signin').onclick=function(){
  var u=document.getElementById('user').value,p=document.getElementById('pass').value;
  if(u==='demo'&&p==='demo'){localStorage.setItem('demoUser',u);location.hash='#/account'}
  else document.getElementById('error').textContent='Invalid credentials';
};
window.addEventListener('hashchange',render);render();
</script>
</body></html>
